    <!-- Extra styles for sleek compact calculator -->
    <style>
        /* Calculator page specific styling - sleek and compact */
        
        /* Main calculator container - sleek and compact */
        .calculator-container {
            background: var(--bg-secondary);
            border-radius: 30px;
            padding: 1.5rem;
            margin: 1rem 0 1.5rem;
            border: 2px solid transparent;
            background-image: linear-gradient(var(--bg-secondary), var(--bg-secondary)), 
                              linear-gradient(135deg, 
                                var(--rainbow-red), 
                                var(--rainbow-orange), 
                                var(--rainbow-yellow), 
                                var(--rainbow-green), 
                                var(--rainbow-blue), 
                                var(--rainbow-purple));
            background-origin: border-box;
            background-clip: padding-box, border-box;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }
        
        /* Display area - compact */
        .calculator-display {
            background: var(--bg-primary);
            border-radius: 20px;
            padding: 1rem 1.5rem;
            margin-bottom: 1rem;
            border: 1px solid rgba(255,255,255,0.05);
            position: relative;
            overflow: hidden;
        }
        
        .calculator-display::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at center, 
                rgba(255, 243, 176, 0.1) 0%,
                transparent 70%);
            animation: rotate 20s linear infinite;
        }
        
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        #calcDisplay {
            font-size: 2.2rem;
            font-weight: 300;
            color: var(--text-primary);
            text-align: right;
            font-family: 'Segoe UI', monospace;
            position: relative;
            z-index: 1;
            word-wrap: break-word;
            min-height: 2.8rem;
            line-height: 1.2;
            transition: all 0.3s ease;
        }
        
        .calculation-preview {
            color: var(--text-secondary);
            font-size: 0.9rem;
            text-align: right;
            margin-top: 0.25rem;
            font-family: monospace;
            opacity: 0.7;
            position: relative;
            z-index: 1;
        }
        
        /* Button grid - compact */
        .calculator-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.6rem;
            margin: 1rem 0 0.8rem;
        }
        
        /* Sleek button styling - smaller */
        .calc-btn-sleek {
            background: var(--bg-primary);
            border: 1px solid rgba(255,255,255,0.05);
            color: var(--text-primary);
            padding: 0.9rem 0.5rem;
            border-radius: 16px;
            font-size: 1.3rem;
            font-weight: 400;
            cursor: none;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        /* Rainbow gradient on hover */
        .calc-btn-sleek:hover {
            background: linear-gradient(135deg, 
                rgba(255, 179, 179, 0.2),
                rgba(255, 201, 162, 0.2),
                rgba(255, 246, 176, 0.2),
                rgba(176, 233, 202, 0.2),
                rgba(176, 212, 255, 0.2),
                rgba(217, 176, 255, 0.2));
            transform: translateY(-2px);
            border-color: rgba(255,255,255,0.1);
        }
        
        /* Number buttons get blue tint */
        .calc-btn-sleek[data-type="number"] {
            color: var(--rainbow-blue);
        }
        
        .calc-btn-sleek[data-type="number"]:hover {
            background: rgba(176, 212, 255, 0.2);
            box-shadow: 0 0 15px rgba(176, 212, 255, 0.3);
        }
        
        /* Operator buttons get purple tint */
        .calc-btn-sleek[data-type="operator"] {
            color: var(--rainbow-purple);
            font-weight: 500;
        }
        
        .calc-btn-sleek[data-type="operator"]:hover {
            background: rgba(217, 176, 255, 0.2);
            box-shadow: 0 0 15px rgba(217, 176, 255, 0.3);
        }
        
        /* Function buttons (C, CE, ⌫) get orange tint */
        .calc-btn-sleek[data-type="function"] {
            color: var(--rainbow-orange);
            font-size: 1.2rem;
        }
        
        .calc-btn-sleek[data-type="function"]:hover {
            background: rgba(255, 201, 162, 0.2);
            box-shadow: 0 0 15px rgba(255, 201, 162, 0.3);
        }
        
        /* Equals button - rainbow gradient and right next to result! */
        .calc-btn-sleek[data-type="equals"] {
            background: linear-gradient(135deg, 
                var(--rainbow-red),
                var(--rainbow-orange),
                var(--rainbow-yellow),
                var(--rainbow-green),
                var(--rainbow-blue),
                var(--rainbow-purple));
            color: var(--bg-primary);
            font-weight: 600;
            font-size: 1.6rem;
            border: none;
        }
        
        .calc-btn-sleek[data-type="equals"]:hover {
            transform: scale(1.02) translateY(-2px);
            box-shadow: 0 0 25px rgba(255, 243, 176, 0.6);
            filter: brightness(1.1);
        }
        
        /* Clear button gets red tint */
        .calc-btn-sleek[data-type="clear"] {
            color: var(--rainbow-red);
            font-weight: 500;
        }
        
        .calc-btn-sleek[data-type="clear"]:hover {
            background: rgba(255, 179, 179, 0.2);
            box-shadow: 0 0 15px rgba(255, 179, 179, 0.3);
        }
        
        /* Ripple effect for button clicks */
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: scale(0);
            animation: ripple-animation 0.6s ease-out;
            pointer-events: none;
        }
        
        @keyframes ripple-animation {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }
        
        /* History panel - now at the bottom, more compact */
        .history-panel {
            background: rgba(255,255,255,0.02);
            border-radius: 16px;
            padding: 0.8rem 1.2rem;
            margin-top: 0.8rem;
            max-height: 120px;
            overflow-y: auto;
            border: 1px solid rgba(255,255,255,0.03);
        }
        
        .history-title {
            color: var(--text-secondary);
            font-size: 0.8rem;
            margin-bottom: 0.6rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .history-title span {
            color: var(--rainbow-purple);
            font-weight: 500;
        }
        
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }
        
        .history-item {
            color: var(--text-secondary);
            padding: 0.3rem 0.6rem;
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.85rem;
            transition: all 0.2s;
            cursor: none;
            background: rgba(255,255,255,0.02);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .history-item:hover {
            background: linear-gradient(90deg, 
                rgba(255, 179, 179, 0.1),
                rgba(255, 201, 162, 0.1),
                rgba(255, 246, 176, 0.1),
                rgba(176, 233, 202, 0.1),
                rgba(176, 212, 255, 0.1),
                rgba(217, 176, 255, 0.1));
            color: var(--text-primary);
            padding-left: 0.9rem;
        }
        
        .history-item .result {
            color: var(--rainbow-green);
            font-weight: 500;
        }
        
        .clear-history {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-secondary);
            padding: 0.2rem 0.6rem;
            border-radius: 10px;
            font-size: 0.7rem;
            cursor: none;
            transition: all 0.2s;
        }
        
        .clear-history:hover {
            border-color: var(--rainbow-red);
            color: var(--rainbow-red);
        }
        
        /* Quick tips - minimal and small */
        .tips-section {
            display: flex;
            justify-content: center;
            gap: 1.2rem;
            margin: 0.8rem 0 0;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }
        
        .tip {
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }
        
        .tip-icon {
            font-size: 0.9rem;
        }
        
        /* Breathing dot - subtle */
        .breathing-dot {
            width: 6px;
            height: 6px;
            background: linear-gradient(135deg, 
                var(--rainbow-red),
                var(--rainbow-purple));
            border-radius: 50%;
            position: fixed;
            bottom: 20px;
            right: 20px;
            opacity: 0.5;
            animation: breathe 4s infinite;
            pointer-events: none;
            z-index: 9999;
        }
        
        @keyframes breathe {
            0%, 100% { transform: scale(1); opacity: 0.3; }
            50% { transform: scale(1.5); opacity: 0.6; }
        }
        
        /* Responsive */
        @media (max-width: 600px) {
            .calculator-container {
                padding: 1.2rem;
            }
            
            #calcDisplay {
                font-size: 1.8rem;
            }
            
            .calc-btn-sleek {
                padding: 0.8rem 0.4rem;
                font-size: 1.2rem;
            }
            
            .calculator-buttons {
                gap: 0.4rem;
            }
            
            .tips-section {
                flex-direction: column;
                align-items: center;
                gap: 0.4rem;
            }
        }
    </style>

    <!-- Sleek Calculator Logic (same as before, works perfectly!) -->
    <script>
        // Calculator state
        let currentInput = '0';
        let previousInput = '';
        let operation = null;
        let resetInput = false;
        let memory = 0;
        let history = [];
        
        // Get elements
        const display = document.getElementById('calcDisplay');
        const preview = document.getElementById('calcPreview');
        const historyList = document.getElementById('historyList');
        
        // Update display
        function updateDisplay() {
            display.textContent = currentInput;
            
            // Show preview if there's an operation
            if (operation && previousInput) {
                preview.textContent = `${previousInput} ${getOperatorSymbol(operation)}`;
            } else {
                preview.textContent = '';
            }
        }
        
        // Get operator symbol
        function getOperatorSymbol(op) {
            const symbols = {
                '+': '+',
                '-': '−',
                '*': '×',
                '/': '÷'
            };
            return symbols[op] || op;
        }
        
        // Add to history
        function addToHistory(expression, result) {
            // Format nicely
            const [first, op, second] = expression.split(' ');
            const displayExpr = `${first} ${op} ${second}`;
            
            history.unshift({ 
                expression: displayExpr, 
                result: result,
                timestamp: Date.now() 
            });
            
            if (history.length > 8) history.pop(); // Keep last 8 calculations
            updateHistory();
        }
        
        // Update history display
        function updateHistory() {
            if (history.length === 0) {
                historyList.innerHTML = '<div class="history-item" style="opacity:0.5; justify-content:center;">✨ no calculations yet</div>';
                return;
            }
            
            historyList.innerHTML = history.map(item => `
                <div class="history-item" onclick="recallCalculation('${item.result}')">
                    <span>${item.expression}</span>
                    <span class="result">= ${item.result}</span>
                </div>
            `).join('');
        }
        
        // Recall calculation from history
        window.recallCalculation = function(result) {
            currentInput = result;
            resetInput = true;
            updateDisplay();
            window.triggerConfetti('low');
        };
        
        // Clear history
        document.getElementById('clearHistory').addEventListener('click', () => {
            history = [];
            updateHistory();
            window.triggerConfetti('low');
        });
        
        // Handle number input
        function inputNumber(num) {
            if (resetInput) {
                currentInput = num;
                resetInput = false;
            } else {
                if (currentInput === '0' && num !== '.') {
                    currentInput = num;
                } else {
                    // Prevent multiple decimals
                    if (num === '.' && currentInput.includes('.')) return;
                    currentInput += num;
                }
            }
            updateDisplay();
            window.triggerConfetti('low');
        }
        
        // Handle operator
        function setOperation(op) {
            if (operation && previousInput && !resetInput) {
                calculate();
            }
            
            previousInput = currentInput;
            operation = op;
            resetInput = true;
            updateDisplay();
        }
        
        // Calculate result
        function calculate() {
            if (!operation || !previousInput) return;
            
            const prev = parseFloat(previousInput);
            const current = parseFloat(currentInput);
            
            if (isNaN(prev) || isNaN(current)) return;
            
            let result;
            let expression = `${previousInput} ${getOperatorSymbol(operation)} ${currentInput}`;
            
            switch (operation) {
                case '+':
                    result = prev + current;
                    break;
                case '-':
                    result = prev - current;
                    break;
                case '*':
                    result = prev * current;
                    break;
                case '/':
                    if (current === 0) {
                        currentInput = '∞';
                        operation = null;
                        previousInput = '';
                        updateDisplay();
                        window.triggerConfetti('fabulous');
                        setTimeout(() => {
                            currentInput = '0';
                            updateDisplay();
                        }, 1500);
                        return;
                    }
                    result = prev / current;
                    break;
                default:
                    return;
            }
            
            // Format result
            result = parseFloat(result.toFixed(10));
            currentInput = result.toString();
            expression += ` = ${currentInput}`;
            
            // Add to history
            addToHistory(expression, currentInput);
            
            operation = null;
            previousInput = '';
            resetInput = true;
            
            updateDisplay();
            
            // Fabulous confetti for equals!
            window.triggerConfetti('fabulous');
        }
        
        // Clear functions
        function clearAll() {
            currentInput = '0';
            previousInput = '';
            operation = null;
            updateDisplay();
            window.triggerConfetti('low');
        }
        
        function clearEntry() {
            currentInput = '0';
            updateDisplay();
            window.triggerConfetti('low');
        }
        
        function backspace() {
            if (currentInput.length > 1) {
                currentInput = currentInput.slice(0, -1);
            } else {
                currentInput = '0';
            }
            updateDisplay();
            window.triggerConfetti('low');
        }
        
        // Button click handler
        function handleButtonClick(value, type) {
            switch (type) {
                case 'number':
                    inputNumber(value);
                    break;
                case 'operator':
                    if (value === 'C') {
                        clearAll();
                    } else if (value === 'CE') {
                        clearEntry();
                    } else if (value === '⌫') {
                        backspace();
                    } else {
                        setOperation(value);
                    }
                    break;
                case 'function':
                    if (value === 'C') clearAll();
                    else if (value === 'CE') clearEntry();
                    else if (value === '⌫') backspace();
                    break;
                case 'equals':
                    calculate();
                    break;
            }
        }
        
        // Add click handlers to buttons
        document.querySelectorAll('.calc-btn-sleek').forEach(button => {
            button.addEventListener('click', (e) => {
                const value = button.dataset.value;
                const type = button.dataset.type;
                
                // Create ripple effect
                const ripple = document.createElement('span');
                ripple.classList.add('ripple');
                const rect = button.getBoundingClientRect();
                ripple.style.left = (e.clientX - rect.left) + 'px';
                ripple.style.top = (e.clientY - rect.top) + 'px';
                button.appendChild(ripple);
                
                setTimeout(() => ripple.remove(), 600);
                
                handleButtonClick(value, type);
            });
        });
        
        // Keyboard support
        document.addEventListener('keydown', (e) => {
            const key = e.key;
            
            if (key >= '0' && key <= '9') {
                inputNumber(key);
            } else if (key === '.') {
                inputNumber('.');
            } else if (key === '+' || key === '-' || key === '*' || key === '/') {
                setOperation(key);
            } else if (key === 'Enter' || key === '=') {
                e.preventDefault();
                calculate();
            } else if (key === 'Escape') {
                clearAll();
            } else if (key === 'Backspace') {
                e.preventDefault();
                backspace();
            }
        });
        
        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => window.triggerConfetti('low'), 500);
            
            // Add some example history
            addToHistory('1 + 1 = 2', '2');
            addToHistory('10 × 10 = 100', '100');
            addToHistory('42 ÷ 2 = 21', '21');
        });
    </script>
